pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.neoforged.net/releases" }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = "slashlootr"

// Shared source lives in plain directories, not Gradle projects: mc-src/, compat/*, loader-*/ and
// common/ are composed into each band via srcDirs by gradle/fabric-band.gradle. Only the bands
// themselves are real projects, so there is exactly one compilation per shipped JAR.
//
// Bands B-J share mc-src. Band A (1.20.1) predates the RandomizableContainer interface and
// ResourceKey<LootTable>, so it stays a self-contained fork -- see its own build.gradle.

include "versions:1.20.1-fabric"    // Band A: MC 1.20.1        (Java 17, forked sources)
include "versions:1.20.5-fabric"    // Band B: MC 1.20.5-1.20.6
include "versions:1.21-fabric"      // Band C: MC 1.21
include "versions:1.21.1-fabric"    // Band C: MC 1.21.1        (primary / TBA target)
include "versions:1.21.2-fabric"    // Band D: MC 1.21.2-1.21.3
include "versions:1.21.4-fabric"    // Band D: MC 1.21.4-1.21.5
include "versions:1.21.5-fabric"    // Band E: MC 1.21.5 (SavedData.Factory already gone here)
include "versions:1.21.6-fabric"    // Band E: MC 1.21.6-1.21.8
include "versions:1.21.9-fabric"    // Band E: MC 1.21.9-1.21.10
include "versions:1.21.11-fabric"   // Band F: MC 1.21.11

// NeoForge bands. NeoForge has no modern line below 1.20.5, and 1.20.1 is reachable only
// through the legacy MDG plugin, so Band A stays Fabric-only and Band B targets 1.20.6.
include "versions:1.20.6-neoforge"  // Band B NeoForge: MC 1.20.6      (NF 20.6.x)
include "versions:1.21.1-neoforge"  // Band C NeoForge: MC 1.21-1.21.1  (NF 21.1.x)
include "versions:1.21.3-neoforge"  // Band D NeoForge: MC 1.21.2-1.21.3 (NF 21.3.x)
include "versions:1.21.4-neoforge"  // Band D NeoForge: MC 1.21.4        (NF 21.4.x)
include "versions:1.21.5-neoforge"  // Band D NeoForge: MC 1.21.5        (NF 21.5.x)
include "versions:1.21.8-neoforge"  // Band E NeoForge: MC 1.21.6-1.21.8 (NF 21.6/21.7 are BETA-ONLY; built on 21.8)
include "versions:1.21.10-neoforge" // Band E NeoForge: MC 1.21.9-1.21.10 (NF 21.9 is BETA-ONLY; built on 21.10)
include "versions:1.21.11-neoforge" // Band F NeoForge: MC 1.21.11       (NF 21.11.x)

// Bands G, J and K (MC 26.1.x / 26.2.x / 26.3.x) are quarantined composites under versions/26.1.2/,
// versions/26.2/ and versions/26.3/, each with its own Gradle wrapper, Loom and JDK 25. The root
// build shells out to them via the build26 / build262 / build263 tasks.

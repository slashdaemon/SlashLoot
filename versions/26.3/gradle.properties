org.gradle.jvmargs=-Xmx2G

# Band K: Minecraft 26.3 "Wilderness Bound" — unobfuscated, JDK 25.
# Coordinates verified against maven.fabricmc.net / maven.neoforged.net on 2026-09-19.
# NeoForge 26.3 is BETA-ONLY — publish the NeoForge JAR with release type `beta`.
# Re-pin as Mojang/Fabric/NeoForge publish 26.3.x point releases.
minecraft_version=26.3
loader_version=0.19.5
fabric_api_version=0.161.0+26.3
neoforge_version=26.3.0.6-beta
neoforge_range=[26.3,26.4)
minecraft_range=[26.3,26.4)

# 26.3 runs on JDK 25; these feed the shared fabric.mod.json / slashlootr.mixins.json templates.
java_version=25
mixin_compat=JAVA_25

# Local fallbacks — kept in sync with the parent gradle.properties so this composite
# can be built standalone via versions/26.3/gradlew.
mod_version=0.3.3
maven_group=dev.blockacademy
archives_base_name=slashlootr

org.gradle.jvmargs=-Xmx2G

# Band J: Minecraft 26.2 "Chaos Cubed" — unobfuscated, JDK 25.
# Coordinates verified against maven.fabricmc.net / maven.neoforged.net on 2026-08-29.
# Re-pin as Mojang/Fabric/NeoForge publish 26.2.x point releases.
minecraft_version=26.2
loader_version=0.19.5
fabric_api_version=0.158.0+26.2
neoforge_version=26.2.0.72
neoforge_range=[26.2,26.3)
minecraft_range=[26.2,26.3)

# 26.2 runs on JDK 25; these feed the shared fabric.mod.json / slashlootr.mixins.json templates.
java_version=25
mixin_compat=JAVA_25

# Local fallbacks — kept in sync with the parent gradle.properties so this composite
# can be built standalone via versions/26.2/gradlew.
mod_version=0.3.1
maven_group=dev.blockacademy
archives_base_name=slashlootr
